{% load static %}
<!-- Top Navigation -->
<nav class="w3-bar w3-white w3-card w3-top" style="height: 64px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; overflow: visible !important; z-index: 1000;">
    
    <!-- Left: Brand -->
    <div class="w3-flex" style="display: flex; align-items: center;">
        <a href="{% url 'recorder:recording_list' %}" class="w3-bar-item w3-button w3-hover-none w3-text-theme" style="display: flex; align-items: center; gap: 8px;">
            <img src="{% static 'images/alo.png' %}"  
                 class="w3-image w3-round" 
                 style="max-width: 300px; max-height: 80px; object-fit: contain;">
            <!-- <strong class="w3-large" style="letter-spacing: -0.5px;">ASR Collecting</strong> -->
        </a>
    </div>

    <!-- Right: Desktop Menu -->
    <div class="w3-hide-small" style="display: flex; align-items: center;">
        <a href="{% url 'recorder:recording_list' %}"
            class="w3-bar-item w3-button w3-round-large w3-margin-right">
            Home
        </a>

        <a href="{% url 'employies:list' %}"
            class="w3-bar-item w3-button w3-round-large w3-margin-right">
            Users
        </a>

        <!-- Profile Dropdown -->
        <div class="w3-dropdown-hover w3-transparent w3-theme w3-round-xlarge" style="position: relative; z-index: 1001;">
            <button class="w3-button w3-round-large" style="display: flex; align-items: center; gap: 8px;">
                <div class="w3-circle w3-white" style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px;">
                    {{ user.username|slice:":1"|upper }}
                </div>
                <span>{{ user.username }}</span>
                <span class="material-icons w3-small">expand_more</span>
            </button>
            <div class="w3-dropdown-content w3-padding w3-bar-block w3-card-4 w3-round-large w3-animate-opacity"
                style="position: absolute; right: 0; top: 100%; min-width: 200px; z-index: 1002;">
                <a href="{% url 'admin:index' %}" class="w3-bar-item w3-button w3-round-large">
                    <i class="fa fa-gear w3-margin-right w3-spin"></i>
                    Settings
                </a>
                <hr class="w3-clear" style="margin: 4px 0;">
                <a href="{% url 'users:logout' %}" class="w3-bar-item w3-button w3-round-large w3-text-red">
                    <i class="fa fa-sign-out w3-margin-right"></i>
                    Sign Out
                </a>
            </div>
        </div>
    </div>
</nav>
