{% load static %}
<div class="w3-white w3-round-large">
    <div class="w3-container w3-padding-8">
        <form method="get" class="search-flex-container" id="search-form">

            {% if status_choices %}
            <div class="search-item-status">
                <div class="w3-display-container">
                    <i class="fa-solid fa-filter w3-display-left w3-margin-left w3-text-grey" style="font-size: 0.8rem;"></i>
                    <select name="status" 
                            class="w3-select w3-border w3-round-medium w3-light-grey lao-noto" 
                            style="height: 36px; padding: 0 8px 0 30px !important; font-size: 0.85rem; border: 1px solid #ddd !important;"
                            onchange="this.form.submit()">
                        <option value="" disabled selected>Status</option>
                        <option value="">All</option>
                        {% for value, label in status_choices %}
                        <option value="{{ value }}" {% if value == current_status %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            {% endif %}

            <div class="search-item-input w3-padding-small">
                <div class="w3-display-container">
                    <i class="fa-solid fa-magnifying-glass w3-display-left w3-margin-left w3-text-grey" style="font-size: 0.8rem;"></i>
                    
                    <input type="text" name="{{ search_param }}" id="search-input"
                           class="w3-input w3-border w3-round-medium w3-light-grey lao-noto" 
                           style="height: 36px; padding: 0 35px 0 30px !important; font-size: 0.85rem; border: 1px solid #ddd !important;"
                           placeholder= 'Search...'
                           value="{{ search_query }}">

                    {% if search_query %}
                    <span class="w3-display-right w3-margin-right w3-text-grey clear-btn" 
                          onclick="clearSearch()" 
                          style="cursor: pointer; z-index: 10;">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </span>
                    {% endif %}
                </div>
            </div>

            <div class="search-item-btn w3-padding-small">
                <button type="submit" 
                        class="w3-button w3-theme w3-round-medium w3-block w3-small w3-bold" 
                        style="height: 36px;">
                    <i class="fa fa-solid fa-search w3-margin-right"></i><span class="w3-hide-small">Search</span>
                </button>
            </div>

        </form>
    </div>
</div>

<script>
function clearSearch() {
    const input = document.getElementById('search-input');
    input.value = ''; 
    document.getElementById('search-form').submit();
}
</script>

<style>
.search-flex-container {
    display: flex;
    gap: 8px;
    align-items: center;
    width: 700px;
}

.search-item-status { flex: 0 0 140px; }
.search-item-input  { flex: 1; }
.search-item-btn    { flex: 0 0 100px; }

.w3-select { appearance: none; }

.clear-btn:hover {
    color: #f44336 !important;
}

@media (max-width: 600px) {
    .search-flex-container {
        flex-wrap: wrap;
        gap: 6px;
        width: 100%;
    }
    
    .search-item-status { flex: 1 1 20%; }
    .search-item-input  { flex: 1 1 50%; }
    
    .search-item-btn { 
        flex: 1 1 10%; 
        margin-top: 2px;
    }
    
    .w3-padding-8 { padding: 8px !important; }
}
</style>
